name: Live data-service checks

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  fink:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install Redback with data dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[data]" pytest
      - name: Check the live Fink API
        env:
          REDBACK_RUN_LIVE_TESTS: "1"
        run: >-
          pytest
          test/get_data_test.py::TestFinkDataGetter::test_collect_data_ztf_live_api
          --durations=5
